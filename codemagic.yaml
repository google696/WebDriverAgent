workflows:
  wda-device:
    name: WDA device build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      groups:
        - wda-secrets
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Install Carthage
        script: |
          if ! command -v carthage >/dev/null 2>&1; then brew install carthage; fi
      - name: Bootstrap dependencies
        script: |
          npm config set legacy-peer-deps true
          ./Scripts/bootstrap.sh
      - name: Import signing certificate
        script: |
          set -e
          echo "$WDA_CERT_P12" | openssl base64 -d -out /tmp/wda_cert.p12
          test -s /tmp/wda_cert.p12
          ls -l /tmp/wda_cert.p12
          security create-keychain -p "" /tmp/build.keychain-db || true
          security import /tmp/wda_cert.p12 -k /tmp/build.keychain-db -P "" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -s /tmp/build.keychain-db ~/Library/Keychains/login.keychain-db
          security unlock-keychain -p "" /tmp/build.keychain-db || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" /tmp/build.keychain-db || true
          security find-identity -v -p codesigning /tmp/build.keychain-db | grep -q "iPhone Developer"
          rm -f /tmp/wda_cert.p12
      - name: Install provisioning profile
        script: |
          set -e
          echo "chunk lengths: $(echo -n "$WDA_PROFILE2_P1" | wc -c) $(echo -n "$WDA_PROFILE2_P2" | wc -c) $(echo -n "$WDA_PROFILE2_P3" | wc -c) $(echo -n "$WDA_PROFILE2_P4" | wc -c)"
          echo "cert length: $(echo -n "$WDA_CERT_P12" | wc -c)"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo -n "$WDA_PROFILE2_P1$WDA_PROFILE2_P2$WDA_PROFILE2_P3$WDA_PROFILE2_P4" | openssl base64 -d -out "$HOME/Library/MobileDevice/Provisioning Profiles/WDA_Runner2.mobileprovision"
          test -s "$HOME/Library/MobileDevice/Provisioning Profiles/WDA_Runner2.mobileprovision"
          ls -l "$HOME/Library/MobileDevice/Provisioning Profiles/"
          security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/WDA_Runner2.mobileprovision" | grep -c "<key>UUID</key>"
      - name: Build WebDriverAgentRunner for device
        script: |
          xcodebuild -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derived_data \
            DEVELOPMENT_TEAM=F9VLMGG7XN \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Developer" \
            build-for-testing
      - name: Package IPA
        script: |
          set -e
          APP=$(find derived_data/Build/Products/Debug-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          test -n "$APP"
          rm -rf Payload WebDriverAgentRunner.ipa
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r WebDriverAgentRunner.ipa Payload
    artifacts:
      - WebDriverAgentRunner.ipa
