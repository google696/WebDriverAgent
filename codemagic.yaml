workflows:
  wda-device:
    name: WDA device build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      groups:
        - wda-secrets
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Install Carthage
        script: |
          if ! command -v carthage >/dev/null 2>&1; then brew install carthage; fi
      - name: Bootstrap dependencies
        script: |
          npm config set legacy-peer-deps true
          ./Scripts/bootstrap.sh
      - name: Fetch signing files
        script: |
          set -e
          TOKEN="${WDA_REPO_TOKEN:-$GITHUB_ACCESS_TOKEN}"
          test -n "$TOKEN"
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          git -c http.extraHeader="Authorization: Basic $AUTH" clone --depth 1 https://github.com/google696/wda-signing-private.git /tmp/signing
          test -s /tmp/signing/wda_cert.p12
          test -s /tmp/signing/WDA_Runner2.mobileprovision
          echo "signing files fetched"
      - name: Import signing certificate
        script: |
          set -e
          security create-keychain -p "" /tmp/build.keychain-db || true
          security import /tmp/signing/wda_cert.p12 -k /tmp/build.keychain-db -P "" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -s /tmp/build.keychain-db ~/Library/Keychains/login.keychain-db
          security unlock-keychain -p "" /tmp/build.keychain-db || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" /tmp/build.keychain-db || true
          security find-identity -v -p codesigning /tmp/build.keychain-db | grep -q "iPhone Developer"
      - name: Install provisioning profile
        script: |
          set -e
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/signing/WDA_Runner2.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/WDA_Runner2.mobileprovision"
          test -s "$HOME/Library/MobileDevice/Provisioning Profiles/WDA_Runner2.mobileprovision"
          security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/WDA_Runner2.mobileprovision" | grep -c "<key>UUID</key>"
      - name: Build WebDriverAgentRunner for device
        script: |
          xcodebuild -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derived_data \
            DEVELOPMENT_TEAM=F9VLMGG7XN \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Developer" \
            build-for-testing
      - name: Package IPA
        script: |
          set -e
          APP=$(find derived_data/Build/Products/Debug-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          test -n "$APP"
          rm -rf Payload WebDriverAgentRunner.ipa
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r WebDriverAgentRunner.ipa Payload
    artifacts:
      - WebDriverAgentRunner.ipa
